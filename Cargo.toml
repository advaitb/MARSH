[package]
name = "otst"
version = "0.1.0"
edition = "2021"
description = "Optimal-transport (tree-Wasserstein) microbial source tracking"
license = "MIT OR Apache-2.0"

[lib]
name = "otst"
path = "src/lib.rs"

[[bin]]
name = "otst"
path = "src/main.rs"

[[bin]]
name = "otst-experiments"
path = "src/bin/experiments.rs"

[dependencies]
# LP solver: good_lp front-end + microlp backend (pure Rust, no C deps).
# Verified 2026-07-07 to compile and solve the LAD tree-Wasserstein LP exactly.
good_lp = { version = "1.15", default-features = false, features = ["microlp"] }
rayon = "1.10"
rand = "0.9"
rand_distr = "0.5"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
criterion = "0.8"

[[bench]]
name = "bootstrap_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
